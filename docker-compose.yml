version: '3.8'
services:
  transferspeedserver:
    network_mode: host
    image: transferspeedserver
    environment:
      - GRPC_PORT=:50051
    volumes:
      - ./data:/data  # Mounts host data folder to /data in container
  transferspeedclient:
    image: transferspeedclient
    dns:
      - 127.0.0.1  # A non-existent or invalid DNS server
    depends_on:
      - transferspeedserver
    environment:
      - GRPC_SERVER_ADDRESS=transferspeedserver:50051
